services:
  - type: web
    name: skill-swap-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false

  - type: web
    name: skill-swap-frontend
    runtime: static
    rootDir: frontend/skill-swap
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://skill-swap-backend-ew5e.onrender.com/api
      - key: VITE_SOCKET_URL
        value: https://skill-swap-backend-ew5e.onrender.com
